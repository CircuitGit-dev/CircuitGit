name: Publish CircuitGit demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source boundaries, reference math and browser-node transport
        run: |
          python -B tools/dev/check_structure.py
          node --test tests/demo/*.test.mjs tests/remote/*.test.mjs tests/ai/*.test.mjs tests/studio/lazy-slot.test.mjs tests/viewer-vendor.test.mjs
          python -B tests/remote/test_node.py
          python -B tests/remote/test_pairing.py
          python -B tests/remote/test_helper.py
          python -B tests/remote/test_development.py
          python -B tests/remote/test_library.py
          python -B tests/library/test_build_library.py
          python -B tests/library/test_history_build.py
          python -B tests/library/test_workflow.py
          python -B tests/library/test_ci.py
          python -B tests/ai/test_sessions.py
          python -B tools/library/test_import.py
          node --test tests/library/*.test.mjs
          python -B tools/workbench/test_library_projects.py
      - name: Build the static workbench
        run: python -B tools/dev/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
