name: Cross-Platform CI (macOS, Windows, Linux)

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode: full (all suites) or quick (fast cross-platform smoke)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
      suites:
        description: 'Optional comma-separated suites (e.g. architecture,remote,simulation,library,ai,frontend)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  detect-changes:
    name: Route CI by changed paths
    runs-on: ubuntu-latest
    outputs:
      run_full_matrix: ${{ steps.scope.outputs.run_full_matrix }}
      run_spiceowl_matrix: ${{ steps.scope.outputs.run_spiceowl_matrix }}
      run_fast_web: ${{ steps.scope.outputs.run_fast_web }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          import os, re, subprocess

          event = os.environ.get('EVENT_NAME', '')
          out_path = os.environ['GITHUB_OUTPUT']

          def emit(full_matrix, spiceowl_matrix, reason):
              fast_web = not full_matrix
              with open(out_path, 'a', encoding='utf-8') as f:
                  f.write(f'run_full_matrix={"true" if full_matrix else "false"}\n')
                  f.write(f'run_spiceowl_matrix={"true" if spiceowl_matrix else "false"}\n')
                  f.write(f'run_fast_web={"true" if fast_web else "false"}\n')
                  f.write(f'reason={reason}\n')
              print(f'CI routing: full_matrix={full_matrix}, spiceowl_matrix={spiceowl_matrix}, fast_web={fast_web} ({reason})')

          if event == 'workflow_dispatch':
              emit(True, True, 'manual workflow_dispatch')
              raise SystemExit(0)

          base = None
          if event == 'pull_request' and os.environ.get('PR_BASE'):
              base = f"origin/{os.environ['PR_BASE']}...HEAD"
          elif event == 'push':
              before = os.environ.get('BEFORE_SHA', '')
              if before and set(before) != {'0'}:
                  base = f"{before}..{os.environ['HEAD_SHA']}"

          files = []
          if base:
              res = subprocess.run(['git', 'diff', '--name-only', base], capture_output=True, text=True)
              if res.returncode == 0:
                  files = [line.strip() for line in res.stdout.splitlines() if line.strip()]

          if not files:
              emit(True, True, 'fallback (no diff base available)')
              raise SystemExit(0)

          web_only_re = re.compile(
              r'^(apps/web/|modules/|tools/dev/build_pages\.py$|docs/|.*\.md$|'
              r'tests/(?:demo|remote|library|studio|ai|workflow)/[^/]+\.mjs$|tests/viewer-vendor\.test\.mjs$)'
          )
          spiceowl_re = re.compile(
              r'^(submodules/spiceowl|contracts/spiceowl|tools/workbench/(?:bootstrap_python|spiceowl|onboarding|server|connect_browser|platform_compat)|'
              r'tests/spiceowl/|\.github/workflows/cross-platform-ci\.yml$)'
          )

          non_web = [p for p in files if not web_only_re.match(p)]
          spiceowl_hits = [p for p in files if spiceowl_re.match(p)]

          print('Changed files:', files)
          if not non_web:
              emit(False, False, 'web/frontend-only change -> fast Linux check')
          else:
              emit(True, bool(spiceowl_hits), f'backend/tooling changed ({len(non_web)} files, spiceowl={len(spiceowl_hits)})')

  fast-web-check:
    name: Fast Web Check (Linux · JS + structure)
    needs: detect-changes
    if: needs.detect-changes.outputs.run_fast_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify structure, build, and frontend tests
        shell: bash
        run: |
          python -B tools/dev/check_structure.py
          python -B tools/dev/build.py web
          node --test tests/demo/*.test.mjs tests/remote/*.test.mjs tests/library/*.test.mjs tests/studio/*.test.mjs tests/ai/*.test.mjs tests/workflow/*.test.mjs tests/viewer-vendor.test.mjs

  cross-platform-tests:
    name: ${{ matrix.label }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run_full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Python 3.12 + Node 22 + ngspice)
            require_ngspice: 'true'
          - os: windows-latest
            label: Windows (Python 3.12 + Node 22 + ngspice)
            require_ngspice: 'false'
          - os: ubuntu-latest
            label: Linux (Python 3.12 + Node 22 + ngspice)
            require_ngspice: 'true'

    steps:
      - name: Configure Git line endings before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git test identity
        shell: bash
        run: |
          git config --global user.name "CircuitGit CI"
          git config --global user.email "ci@circuitgit.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install ngspice && ngspice --version

      - name: Install ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ngspice && ngspice --version

      - name: Install native Windows ngspice (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\usr\bin\bash.exe") {
            & C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-ngspice"
            if ($LASTEXITCODE -eq 0 -and (Test-Path "C:\msys64\ucrt64\bin")) {
              Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"
              Write-Host "Installed native Windows ngspice via MSYS2 UCRT64."
            } else {
              Write-Warning "MSYS2 ngspice installation did not succeed; local SPICE unit tests will still run."
            }
          } else {
            Write-Warning "MSYS2 not present on runner; local SPICE unit tests will still run."
          }

      - name: Verify OS launcher entrypoints
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "Start CircuitGit.bat"
            python -B tools/workbench/connect_browser.py --help
            python -B tools/workbench/bootstrap_python.py --entry connect_browser --help
          else
            test -x "Start CircuitGit.command"
            bash -n "Start CircuitGit.command"
            python -B tools/workbench/connect_browser.py --help
          fi

      - name: Run full cross-platform test suite
        shell: bash
        run: |
          ARGS=("--require-node" "--json-report" "reports/test-report-${{ matrix.os }}.json")
          if [ "${{ inputs.mode }}" = "quick" ]; then
            ARGS+=("--quick")
          fi
          if [ -n "${{ inputs.suites }}" ]; then
            ARGS+=("--suite" "${{ inputs.suites }}")
          fi
          if [ "${{ matrix.require_ngspice }}" = "true" ]; then
            ARGS+=("--require-ngspice")
          fi
          python -B tools/dev/run_tests.py "${ARGS[@]}"

      - name: Upload cross-platform test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-report-${{ matrix.os }}
          path: reports/test-report-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 14

  spiceowl-bootstrap-matrix:
    name: SpiceOwl Bootstrap (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.run_spiceowl_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned SpiceOwl (0c26d8b) natively supports macOS, Windows, and Linux via _platform.py.
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Configure Git line endings before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git test identity
        shell: bash
        run: |
          git config --global user.name "CircuitGit CI"
          git config --global user.email "ci@circuitgit.invalid"

      - name: Verify isolated project Python bootstrap (SpiceOwl + ADCToolbox)
        shell: bash
        run: |
          BOOTSTRAP_JSON=$(python -B tools/workbench/bootstrap_python.py --setup-only)
          echo "$BOOTSTRAP_JSON"
          VENV_PY=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["python"])' "$BOOTSTRAP_JSON")
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"

      - name: Run SpiceOwl integration tests inside bootstrapped environment
        shell: bash
        run: |
          "$VENV_PY" -B tools/dev/run_tests.py --suite spiceowl --require-spiceowl --json-report "reports/spiceowl-report-${{ matrix.os }}.json"

      - name: Upload SpiceOwl bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiceowl-bootstrap-report-${{ matrix.os }}
          path: reports/spiceowl-report-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 14
